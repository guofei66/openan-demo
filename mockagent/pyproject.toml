[project]
name = "mockagent-engine"
version = "0.1.0"
description = "A2A-T Mock Agent service: stub agents, dataset matching, LLM generation and workflow orchestration"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2,<2",
    "a2a-t-sdk>=1.0.9,<2",
    "workflow-exec-engine>=0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "pyjwt>=2.9,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockagent_engine"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
