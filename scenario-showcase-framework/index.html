<!doctype html>
<html lang="zh-CN" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Scenario Showcase — standalone dev</title>
    <style>
      /* standalone-only shell: replicate what the Portal host provides to the
         plugin (dark root class, color-scheme, full-height chain, zero margins).
         NOT part of the plugin bundle — the portal keeps controlling these. */
      html, body { height: 100%; margin: 0; padding: 0; background: #09090b; }
      #root { height: 100%; }
    </style>
    <script>
      document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = 'dark';
    </script>
    <!-- build stamp in the tab title: makes stale cached sessions instantly
         identifiable during demo iterations (file mtime == deploy time). -->
    <script>
      try {
        document.title += ' · build ' + new Date(document.lastModified).toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch (e) { /* noop */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
