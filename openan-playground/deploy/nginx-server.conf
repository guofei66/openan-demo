# openan-debug begin
server {
    listen 9004;
    server_name _;

    # 阿里云上游服务的 IP 直连入口（前缀剥离转发，供调试代理默认地址使用）
    # /rc/ -> Registry Center(5000)  /oc/ -> Orchestration Center(5001)
    # /a2a/ -> Mock Agent A2A(9100/debug/a2a)  /ot/ -> Ontology(8787)
    location /rc/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /oc/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /a2a/ {
        proxy_pass http://127.0.0.1:9100/debug/a2a/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /ot/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /debug/api/ {
        proxy_pass http://127.0.0.1:9100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /debug/a2a/ {
        proxy_pass http://127.0.0.1:9100/debug/a2a/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
    location /debug/ {
        alias /OpenA2A-T/openan-debug-frontend/;
        try_files $uri $uri/ /debug/index.html;
    }
    location = /debug/index.html {
        alias /OpenA2A-T/openan-debug-frontend/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        return 302 /debug/;
    }
    location = /debug { return 301 /debug/; }
}
# openan-debug end
